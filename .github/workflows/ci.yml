name: CI

on:
  push:
    branches: [master]
  # Every pull request, not only those targeting master. A stacked change opened against the branch
  # below it in the stack is still a change that has to build and pass, and restricting this to
  # [master] meant those PRs reported no checks at all.
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # No submodules: the KiCad .proto definitions are vendored under protos/ and pinned by
      # protos/KICAD_PIN. Fetching them through a submodule cost a 1.4 GB checkout of the whole
      # KiCad source tree on every run to obtain 128 KB of files.
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The pin is only worth having if drift is caught. This re-fetches api/proto from the pinned
      # commit (a blobless sparse fetch, ~3 MB) and fails if the vendored copies differ, or if the
      # pinned ref is a tag that has been moved to a different commit.
      - name: Verify vendored protos match the pinned KiCad commit
        run: ./scripts/sync-protos.sh --check

      - name: Restore
        run: dotnet restore KiCadSharp.slnx

      - name: Build
        run: dotnet build KiCadSharp.slnx -c Release --no-restore

      - name: Test
        run: dotnet test KiCadSharp.slnx -c Release --no-build --logger "console;verbosity=normal"

      - name: Pack
        run: dotnet pack KiCadSharp.slnx -c Release --no-build -o artifacts/packages

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: warn

  # The live IPC tests, against KiCad master. The build job above runs the same test assemblies
  # with no KiCad, where every live test returns early; this job starts pcbnew and eeschema from
  # the dev image (KiCad 10.0.6 plus the master nightly, published by scripts/kicad-dev-image.sh)
  # and runs only the live suites. A separate job so a KiCad-side change shows up as this failing,
  # not as the library failing to build.
  ipc-nightly:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
    env:
      KICADSHARP_KICAD_FLAVOR: nightly
      KICADSHARP_CONTAINER_RUNTIME: docker
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build
        run: dotnet build KiCadSharp.slnx -c Release

      # The harness prints `export NAME=value` lines; GITHUB_ENV takes NAME=value.
      - name: Start KiCad master, pcbnew and eeschema
        run: |
          scripts/kicad-ipc-container.sh start tests/KiCadSharp.Tests/data/kicad10-pcbnew.kicad_pcb | sed 's/^export //' >> "$GITHUB_ENV"
          scripts/kicad-ipc-container.sh start tests/KiCadSharp.Tests/data/duplicate-refs/duplicate-refs.kicad_sch | sed 's/^export //' >> "$GITHUB_ENV"

      - name: Live tests
        run: >
          dotnet test KiCadSharp.slnx -c Release --no-build
          --filter "FullyQualifiedName~IpcTests|FullyQualifiedName~IpcMasterTests|FullyQualifiedName~IpcSchematicTests"
          --logger "console;verbosity=normal"

      - name: KiCad logs
        if: failure()
        run: |
          docker logs kicad-sharp-ipc-pcb 2>&1 | tail -50 || true
          docker logs kicad-sharp-ipc-sch 2>&1 | tail -50 || true

      - name: Stop KiCad
        if: always()
        run: scripts/kicad-ipc-container.sh stop

