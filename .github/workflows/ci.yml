name: CI

on:
  push:
    branches: [master]
  # Every pull request, not only those targeting master. A stacked change opened against the branch
  # below it in the stack is still a change that has to build and pass, and restricting this to
  # [master] meant those PRs reported no checks at all.
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # No submodules: the KiCad .proto definitions are vendored under protos/ and pinned by
      # protos/KICAD_PIN. Fetching them through a submodule cost a 1.4 GB checkout of the whole
      # KiCad source tree on every run to obtain 128 KB of files.
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The pin is only worth having if drift is caught. This re-fetches api/proto from the pinned
      # tag (a blobless sparse clone, ~3 MB) and fails if the vendored copies differ, or if the tag
      # itself has been moved to a different commit.
      - name: Verify vendored protos match the pinned KiCad tag
        run: ./scripts/sync-protos.sh --check

      - name: Restore
        run: dotnet restore KiCadSharp.slnx

      - name: Build
        run: dotnet build KiCadSharp.slnx -c Release --no-restore

      - name: Test
        run: dotnet test KiCadSharp.slnx -c Release --no-build --logger "console;verbosity=normal"

      - name: Pack
        run: dotnet pack KiCadSharp.slnx -c Release --no-build -o artifacts/packages

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: warn
